name: thinkpad-kinoite
description: Custom Fedora Kinoite image for ThinkPad T460
base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  # 1. Enable RPM Fusion (Free & Non-Free)
  - type: rpm-fusion

  # 2. Enable COPR Repositories
  - type: copr
    repos:
      - peterwu/iosevka
      - theblackdon/kineticwe
      - lionheartp/Hyprland
      - theblackdon/dcli-bootc
      - linuxgamerlife/lgl-dnf-helper
      - linuxgamerlife/lgl-emoji-picker

  # 3. Enable Terra Repository
  - type: yum-repo
    repos:
      - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo

  # 4. Base RPM Packages
  - type: rpm-ostree
    install:
      # Custom COPR & Terra Tools
      - kineticwe
      - noctalia-git
      - lgl-emoji-picker
      - lgl-dnf-helper

      # Shell & Terminal
      - fish
      - kitty
      
      # Theming & Qt/GTK tools
      - qt5ct
      - qt6ct
      - nwg-look
      - adw-gtk3-theme
           
      # Fonts
      - iosevka-fonts

      # CLI Utilities & Applications
      - fastfetch
      - btop
      - htop
      - git
      - zoxide
      - eza
      - gwenview
      - haruna
      - zathura
      - neovim
      
    remove:
      # Remove default browser to prefer Flatpak/Chrome
      - firefox
      - firefox-langpacks

  # 5. Homebrew (Linuxbrew)
  - type: brew

  # 6. Nix (Multi-user daemon & Flakes enabled)
  - type: nix

  # 7. System-wide Flatpaks
  - type: flatpak
    notify: true
    system:
      repo-url: https://dl.flathub.org/repo/flathub.flatpakrepo
      repo-name: flathub
      repo-description: Flathub
      install:
        - com.google.Chrome
        - io.github.equibop.Equibop

  # 8. System Tweaks & Shell Configuration
  - type: script
    snippets:
      - "sed -i 's|SHELL=/bin/bash|SHELL=/usr/bin/fish|' /etc/default/useradd"
      - "grep -qxF '/usr/bin/fish' /etc/shells || echo '/usr/bin/fish' >> /etc/shells"
      - "echo 'Custom Kinoite image build finished successfully!'"