name: thinkpad-kinoite
description: Custom Fedora Kinoite image for ThinkPad T460
base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  # 1. Enable custom repositories (COPR & Terra)
  - type: copr
    repos:
      - peterwu/iosevka
      - theblackdon/kineticwe
      - lionheartp/Hyprland
      - theblackdon/dcli-bootc
      - linuxgamerlife/lgl-dnf-helper
      - linuxgamerlife/lgl-emoji-picker
  
  - type: yum-repo
    repos:
      - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo

  # 2. Base RPM packages
  - type: rpm-ostree
    install:
      - kineticwe
      - noctalia-git
      - qt5ct
      - qt6ct
      - nwg-look
      - adw-gtk3-theme
      - kitty
      - fish
      - lgl-emoji-picker
      - lgl-dnf-helper 
      - iosevka-fonts
      - fastfetch
      - btop
      - htop
      - git
      - zoxide
      - eza
      - gwenview
      - haruna
      - zathura
      - neovim
    remove:
      - firefox
      - firefox-langpacks

  # 3. System-wide Flatpaks
  - type: flatpak
    notify: true
    system:
      repo-url: https://dl.flathub.org/repo/flathub.flatpakrepo
      repo-name: flathub
      repo-description: Flathub
      install:
        - com.google.Chrome
        - io.github.equibop.Equibop

  # 4. Install Homebrew
  - type: brew

  # 5. Install Nix
  - type: nix

  # 6. Custom scripts
  - type: script
    snippets:
      - "sed -i 's|SHELL=/bin/bash|SHELL=/usr/bin/fish|' /etc/default/useradd"
      - "grep -qxF '/usr/bin/fish' /etc/shells || echo '/usr/bin/fish' >> /etc/shells"
      - "echo 'Custom image build finished successfully!'"