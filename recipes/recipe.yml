---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bootnetic
description: Custom Fedora Kinoite image

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  - type: dnf
    repos:
      copr:
        - peterwu/iosevka
        - theblackdon/kineticwe
        - lionheartp/Hyprland
        - linuxgamerlife/lgl-dnf-helper
        - linuxgamerlife/lgl-emoji-picker

  - type: script
    snippets:
      - "curl -sL https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo -o /etc/yum.repos.d/terra.repo"
      # Swap/override base kwin-common with kineticwe from COPR
      - "rpm-ostree override replace --experimental --from repo='copr:copr.fedorainfracloud.org:theblackdon:kineticwe' kwin-common || dnf swap -y kwin-common kineticwe"

  - type: rpm-ostree
    install:
      - noctalia-git
      - qt5ct
      - qt6ct
      - nwg-look
      - adw-gtk3-theme
      - kitty
      - fish
      - lgl-emoji-picker
      - lgl-dnf-helper
      - iosevka-fonts
      - fastfetch
      - btop
      - htop
      - git
      - zoxide
      - eza
      - gwenview
      - haruna
      - zathura
      - neovim
    remove:
      - firefox
      - firefox-langpacks

  # 3. System-wide Flatpaks (v2 syntax)
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
        - com.google.Chrome
        - org.equicord.equibop

  # 4. Install Homebrew
  - type: brew

  # ============================================================
  # Nix bootstrap
  #
  # Nix is NOT installed during image build.
  #
  # The image contains:
  #
  #   /var/nix
  #       persistent Nix store
  #
  #   /nix
  #       bind mount -> /var/nix
  #
  #   nix-firstboot.service
  #       installs Nix after first boot
  #
  # This avoids running the Nix installer as root during
  # the BlueBuild container build.
  # ============================================================

  - type: script
    snippets:

      - |
        set -eux

        echo "========================================"
        echo " Preparing Nix directories"
        echo "========================================"

        mkdir -p /var/nix
        mkdir -p /nix

        chmod 755 /var/nix
        chmod 755 /nix


        echo "========================================"
        echo " Creating nix.mount"
        echo "========================================"

        mkdir -p /etc/systemd/system

        cat > /etc/systemd/system/nix.mount <<'EOF'
        [Unit]
        Description=Bind mount /var/nix to /nix
        Before=local-fs.target
        After=local-fs-pre.target
        Wants=local-fs-pre.target

        [Mount]
        What=/var/nix
        Where=/nix
        Type=none
        Options=bind

        [Install]
        WantedBy=local-fs.target
        EOF

        systemctl enable nix.mount


        echo "========================================"
        echo " Creating Nix first-boot installer"
        echo "========================================"

        mkdir -p /usr/libexec

        cat > /usr/libexec/install-nix-firstboot <<'EOF'
        #!/usr/bin/env bash

        set -euo pipefail

        MARKER="/var/lib/nix-installed"


        # --------------------------------------------------------
        # Already installed?
        # --------------------------------------------------------

        if [[ -f "$MARKER" ]]; then
            echo "Nix is already installed."
            exit 0
        fi


        # --------------------------------------------------------
        # Wait for /nix mount
        # --------------------------------------------------------

        echo "Waiting for /nix mount..."

        for _ in {1..60}; do
            if mountpoint -q /nix; then
                break
            fi

            sleep 1
        done

        if ! mountpoint -q /nix; then
            echo "ERROR: /nix is not mounted."
            exit 1
        fi


        echo "/nix is mounted."


        # --------------------------------------------------------
        # Prepare Nix build group
        #
        # The official multi-user installer also performs this
        # setup, but creating the group beforehand makes the
        # environment predictable.
        # --------------------------------------------------------

        echo "Preparing nixbld group..."

        if ! getent group nixbld >/dev/null 2>&1; then
            groupadd --system nixbld
        fi


        # --------------------------------------------------------
        # Create Nix build users
        # --------------------------------------------------------

        echo "Creating Nix build users..."

        for i in $(seq 1 16); do

            USER="nixbld$i"

            if ! id "$USER" >/dev/null 2>&1; then

                useradd \
                    --system \
                    --no-create-home \
                    --shell /usr/sbin/nologin \
                    --gid nixbld \
                    "$USER"

            fi

        done


        # --------------------------------------------------------
        # Install Nix
        #
        # IMPORTANT:
        #
        # --daemon = multi-user installation
        #
        # Do NOT use --no-daemon here.
        # --------------------------------------------------------

        echo "========================================"
        echo " Installing Nix"
        echo "========================================"

        if [[ ! -x /nix/var/nix/profiles/default/bin/nix ]]; then

            curl \
                --proto '=https' \
                --tlsv1.2 \
                -L \
                https://nixos.org/nix/install \
                | sh -s -- --daemon

        else

            echo "Nix binary already exists."

        fi


        # --------------------------------------------------------
        # Configure Nix
        # --------------------------------------------------------

        echo "========================================"
        echo " Configuring Nix"
        echo "========================================"

        mkdir -p /etc/nix

        cat > /etc/nix/nix.conf <<'EOF'
        experimental-features = nix-command flakes
        build-users-group = nixbld
        auto-optimise-store = true
        max-jobs = auto
        EOF


        # --------------------------------------------------------
        # Configure users
        #
        # Fedora Atomic stores home directories under:
        #
        #   /var/home/<user>
        #
        # We configure every normal user found there.
        # --------------------------------------------------------

        echo "========================================"
        echo " Configuring user Nix environments"
        echo "========================================"

        for user_dir in /var/home/*; do

            [[ -d "$user_dir" ]] || continue

            USER_NAME="$(basename "$user_dir")"


            if ! id "$USER_NAME" >/dev/null 2>&1; then
                continue
            fi


            USER_HOME="$(getent passwd "$USER_NAME" | cut -d: -f6)"


            if [[ ! -d "$USER_HOME" ]]; then
                continue
            fi


            echo "Configuring Nix for user: $USER_NAME"
            echo "Home: $USER_HOME"


            mkdir -p "$USER_HOME/.config/nix"


            cat > "$USER_HOME/.config/nix/nix.conf" <<'EOF'
        experimental-features = nix-command flakes
        EOF


            chown \
                "$USER_NAME:$(id -gn "$USER_NAME")" \
                "$USER_HOME/.config/nix/nix.conf"

        done


        # --------------------------------------------------------
        # Global Nix profile
        #
        # This makes Nix available to login shells.
        # --------------------------------------------------------

        echo "========================================"
        echo " Creating global Nix profile"
        echo "========================================"

        mkdir -p /etc/profile.d

        cat > /etc/profile.d/nix.sh <<'EOF'
        if [ -e /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh ]; then
            . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
        fi
        EOF

        chmod 644 /etc/profile.d/nix.sh


        # --------------------------------------------------------
        # Mark installation complete
        # --------------------------------------------------------

        echo "========================================"
        echo " Nix installation completed"
        echo "========================================"

        touch "$MARKER"

        exit 0
        EOF

        chmod 0755 /usr/libexec/install-nix-firstboot


        echo "========================================"
        echo " Creating nix-firstboot.service"
        echo "========================================"

        cat > /etc/systemd/system/nix-firstboot.service <<'EOF'
        [Unit]
        Description=Install Nix on first boot

        Requires=nix.mount
        After=nix.mount

        Wants=network-online.target
        After=network-online.target

        [Service]
        Type=oneshot

        ExecStart=/usr/libexec/install-nix-firstboot

        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target
        EOF

        systemctl enable nix-firstboot.service


        echo "========================================"
        echo " Nix first-boot configuration complete"
        echo "========================================"

  # 6. Custom scripts
  - type: script
    snippets:
      - "sed -i 's|SHELL=/bin/bash|SHELL=/usr/bin/fish|' /etc/default/useradd"
      - "grep -qxF '/usr/bin/fish' /etc/shells || echo '/usr/bin/fish' >> /etc/shells"
      - "echo 'Custom image build finished successfully!'"

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
