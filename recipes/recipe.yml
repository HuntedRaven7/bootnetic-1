# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: bootnetic
description: Custom Fedora Kinoite image with KineticWE brew and nix
base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:

  # ------------------------------------------------------------
  # Base packages
  # ------------------------------------------------------------

  - type: dnf
    install:
      packages:
        - curl
        - git
        - wget
        - bash
        - util-linux
        - shadow-utils

  # ------------------------------------------------------------
  # Nix storage
  #
  # /var/nix is persistent on Atomic systems.
  # /nix is a bind mount to /var/nix.
  # ------------------------------------------------------------

  - type: script
    snippets:

      - |
        set -eux

        echo "=== Preparing Nix directories ==="

        mkdir -p /var/nix
        mkdir -p /nix

        chmod 755 /var/nix
        chmod 755 /nix

        echo "=== Creating Nix mount ==="

        mkdir -p /etc/systemd/system

        cat > /etc/systemd/system/nix.mount <<'EOF'
        [Unit]
        Description=Bind mount /var/nix to /nix
        Before=local-fs.target
        After=local-fs-pre.target
        Wants=local-fs-pre.target

        [Mount]
        What=/var/nix
        Where=/nix
        Type=none
        Options=bind

        [Install]
        WantedBy=local-fs.target
        EOF

        systemctl enable nix.mount

        echo "=== Creating Nix first-boot installer ==="

        mkdir -p /usr/libexec

        cat > /usr/libexec/install-nix-firstboot <<'EOF'
        #!/usr/bin/env bash

        set -euo pipefail

        MARKER="/var/lib/nix-installed"

        if [[ -f "$MARKER" ]]; then
            exit 0
        fi

        echo "=== Waiting for /nix mount ==="

        for _ in {1..30}; do
            if mountpoint -q /nix; then
                break
            fi

            sleep 1
        done

        if ! mountpoint -q /nix; then
            echo "ERROR: /nix is not mounted"
            exit 1
        fi

        echo "=== Preparing Nix build users ==="

        if ! getent group nixbld >/dev/null 2>&1; then
            groupadd --system nixbld
        fi

        echo "=== Creating Nix build users ==="

        for i in $(seq 1 16); do
            USER="nixbld$i"

            if ! id "$USER" >/dev/null 2>&1; then
                useradd \
                    --system \
                    --no-create-home \
                    --shell /usr/sbin/nologin \
                    --gid nixbld \
                    "$USER"
            fi
        done

        echo "=== Setting Nix ownership ==="

        chown root:root /nix
        chmod 0755 /nix

        echo "=== Installing Nix ==="

        if [[ ! -x /nix/var/nix/profiles/default/bin/nix ]]; then

            curl \
                --proto '=https' \
                --tlsv1.2 \
                -L \
                https://nixos.org/nix/install \
                | sh -s -- --daemon

        fi

        echo "=== Configuring Nix ==="

        mkdir -p /etc/nix

        cat > /etc/nix/nix.conf <<'EOF'
        experimental-features = nix-command flakes
        build-users-group = nixbld
        auto-optimise-store = true
        max-jobs = auto
        EOF

        echo "=== Enabling nix-daemon ==="

        systemctl enable nix-daemon.service

        echo "=== Creating user Nix environment ==="

        for user_dir in /var/home/*; do

            [[ -d "$user_dir" ]] || continue

            USER_NAME="$(basename "$user_dir")"

            if id "$USER_NAME" >/dev/null 2>&1; then

                USER_HOME="$(getent passwd "$USER_NAME" | cut -d: -f6)"

                if [[ -d "$USER_HOME" ]]; then

                    mkdir -p "$USER_HOME/.config/nix"

                    cat > "$USER_HOME/.config/nix/nix.conf" <<'EOF'
        experimental-features = nix-command flakes
        EOF

                    chown \
                        "$USER_NAME:$(id -gn "$USER_NAME")" \
                        "$USER_HOME/.config/nix/nix.conf"

                fi
            fi

        done

        echo "=== Nix installation completed ==="

        touch "$MARKER"

        exit 0
        EOF

        chmod 0755 /usr/libexec/install-nix-firstboot

        echo "=== Creating first-boot service ==="

        cat > /etc/systemd/system/nix-firstboot.service <<'EOF'
        [Unit]
        Description=Install Nix on first boot

        Requires=nix.mount
        After=nix.mount
        Before=nix-daemon.service

        Wants=network-online.target
        After=network-online.target

        [Service]
        Type=oneshot
        ExecStart=/usr/libexec/install-nix-firstboot
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target
        EOF

        systemctl enable nix-firstboot.service

        echo "=== Nix first-boot configuration complete ==="

  # ------------------------------------------------------------
  # Shell environment
  # ------------------------------------------------------------

  - type: script
    snippets:

      - |
        set -eux

        mkdir -p /etc/profile.d

        cat > /etc/profile.d/nix.sh <<'EOF'
        if [ -e /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh ]; then
            . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
        fi
        EOF

        chmod 644 /etc/profile.d/nix.sh
