---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: bootnetic
description: Custom Fedora Kinoite image with KineticWE brew and nix

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  # ------------------------------------------------------------
  # COPR repositories
  # ------------------------------------------------------------
  - type: dnf
    repos:
      copr:
        - peterwu/iosevka
        - theblackdon/kineticwe
        - lionheartp/Hyprland
        - linuxgamerlife/lgl-dnf-helper
        - linuxgamerlife/lgl-emoji-picker

  # ------------------------------------------------------------
  # Terra repository + KineticWE
  # ------------------------------------------------------------
  - type: script
    snippets:
      - |
        set -eux

        curl -sL \
          https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo \
          -o /etc/yum.repos.d/terra.repo

        rpm-ostree override replace \
          --experimental \
          --from repo='copr:copr.fedorainfracloud.org:theblackdon:kineticwe' \
          kwin-common \
          || dnf swap -y kwin-common kineticwe

  # ------------------------------------------------------------
  # RPM packages
  # ------------------------------------------------------------
  - type: rpm-ostree
    install:
      - noctalia-git
      - qt5ct
      - qt6ct
      - nwg-look
      - adw-gtk3-theme
      - kitty
      - fish
      - lgl-emoji-picker
      - lgl-dnf-helper
      - iosevka-fonts
      - fastfetch
      - btop
      - htop
      - git
      - zoxide
      - eza
      - gwenview
      - haruna
      - zathura
      - neovim
      - libcurl
      - ncurses

    remove:
      - firefox
      - firefox-langpacks

  # ------------------------------------------------------------
  # System Flatpaks
  # ------------------------------------------------------------
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - com.google.Chrome
          - org.equicord.equibop
          - org.gtk.Gtk3theme.adw-gtk3
          - org.gtk.Gtk3theme.adw-gtk3-dark

  # ------------------------------------------------------------
  # Homebrew
  # ------------------------------------------------------------
  - type: brew

  # ------------------------------------------------------------
  # Prepare Nix
  #
  # Nix is NOT installed during image build.
  #
  # The official installer does not support being executed as
  # root inside the BlueBuild build environment.
  #
  # Instead we:
  #
  #   /var/nix  -> persistent Nix storage
  #   /nix      -> bind mount
  #
  # and install Nix automatically on the first boot.
  # ------------------------------------------------------------
  - type: script
    snippets:
      - |
        set -eux

        echo "=== Preparing Nix directories ==="

        mkdir -p /var/nix
        mkdir -p /nix

        chmod 755 /var/nix
        chmod 755 /nix

        echo "=== Creating Nix mount ==="

        mkdir -p /etc/systemd/system

        cat > /etc/systemd/system/nix.mount <<'EOF'
        [Unit]
        Description=Bind mount /var/nix to /nix
        Before=local-fs.target
        After=local-fs-pre.target
        Wants=local-fs-pre.target

        [Mount]
        What=/var/nix
        Where=/nix
        Type=none
        Options=bind

        [Install]
        WantedBy=local-fs.target
        EOF

        systemctl enable nix.mount

        echo "=== Creating Nix first-boot installer ==="

        mkdir -p /usr/libexec

        cat > /usr/libexec/install-nix-firstboot <<'EOF'
        #!/usr/bin/env bash

        set -euo pipefail

        MARKER="/var/lib/nix-installed"

        if [[ -f "$MARKER" ]]; then
            exit 0
        fi

        # Wait until /nix is actually mounted.
        if ! mountpoint -q /nix; then
            exit 1
        fi

        # Find the first normal user.
        USER_NAME=""

        while IFS=: read -r username _ uid _ _ home shell; do
            if [[ "$uid" -ge 1000 && "$uid" -lt 60000 ]]; then
                if [[ "$shell" != "/usr/sbin/nologin" && \
                      "$shell" != "/sbin/nologin" ]]; then
                    USER_NAME="$username"
                    break
                fi
            fi
        done < /etc/passwd

        if [[ -z "$USER_NAME" ]]; then
            echo "No normal user found yet."
            exit 1
        fi

        USER_HOME="$(getent passwd "$USER_NAME" | cut -d: -f6)"

        echo "Installing Nix for user: $USER_NAME"
        echo "Home: $USER_HOME"

        # The official installer must not be executed as root.
        runuser -u "$USER_NAME" -- bash -c '
          set -e

          if command -v nix >/dev/null 2>&1; then
            exit 0
          fi

          curl --proto "=https" \
            --tlsv1.2 \
            -L \
            https://nixos.org/nix/install \
            | sh -s -- --no-daemon
        '

        touch "$MARKER"

        echo "Nix installation completed."
        exit 0
        EOF

        chmod 755 /usr/libexec/install-nix-firstboot

        echo "=== Creating first-boot service ==="

        cat > /etc/systemd/system/nix-firstboot.service <<'EOF'
        [Unit]
        Description=Install Nix on first boot
        After=nix.mount
        Requires=nix.mount
        After=network-online.target
        Wants=network-online.target

        [Service]
        Type=oneshot
        ExecStart=/usr/libexec/install-nix-firstboot
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target
        EOF

        systemctl enable nix-firstboot.service

        echo "=== Nix first-boot configuration complete ==="

  # ------------------------------------------------------------
  # Custom system configuration
  # ------------------------------------------------------------
  - type: script
    snippets:
      - |
        set -eux

        sed -i \
          's|SHELL=/bin/bash|SHELL=/usr/bin/fish|' \
          /etc/default/useradd

        grep -qxF '/usr/bin/fish' /etc/shells || \
          echo '/usr/bin/fish' >> /etc/shells

        echo "Custom image build finished successfully!"

  # ------------------------------------------------------------
  # Signing
  # ------------------------------------------------------------
  - type: signing
