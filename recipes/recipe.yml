---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bootnetic
description: Custom Fedora Kinoite image

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  - type: dnf
    repos:
      copr:
        - peterwu/iosevka
        - theblackdon/kineticwe
        - lionheartp/Hyprland
        - linuxgamerlife/lgl-dnf-helper
        - linuxgamerlife/lgl-emoji-picker

  - type: script
    snippets:
      - "curl -sL https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo -o /etc/yum.repos.d/terra.repo"
      # Swap/override base kwin-common with kineticwe from COPR
      - "rpm-ostree override replace --experimental --from repo='copr:copr.fedorainfracloud.org:theblackdon:kineticwe' kwin-common || dnf swap -y kwin-common kineticwe"

  - type: rpm-ostree
    install:
      - noctalia-git
      - qt5ct
      - qt6ct
      - nwg-look
      - adw-gtk3-theme
      - kitty
      - fish
      - lgl-emoji-picker
      - lgl-dnf-helper
      - iosevka-fonts
      - fastfetch
      - btop
      - htop
      - git
      - zoxide
      - eza
      - gwenview
      - haruna
      - zathura
      - neovim
    remove:
      - firefox
      - firefox-langpacks

  # 3. System-wide Flatpaks (v2 syntax)
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
        - com.google.Chrome
        - org.equicord.equibop

  # 4. Install Homebrew
  - type: brew

  # ============================================================
  # Nix bootstrap
  # ============================================================

  - type: script
    snippets:

      - |
        set -eux

        echo "========================================"
        echo " Preparing Nix directories"
        echo "========================================"

        mkdir -p /var/nix
        mkdir -p /nix

        chmod 755 /var/nix
        chmod 755 /nix


        echo "========================================"
        echo " Creating nix.mount"
        echo "========================================"

        mkdir -p /etc/systemd/system

        cat > /etc/systemd/system/nix.mount <<'NIXMOUNT'
        [Unit]
        Description=Bind mount /var/nix to /nix
        Before=local-fs.target
        After=local-fs-pre.target
        Wants=local-fs-pre.target

        [Mount]
        What=/var/nix
        Where=/nix
        Type=none
        Options=bind

        [Install]
        WantedBy=local-fs.target
        NIXMOUNT

        systemctl enable nix.mount


        echo "========================================"
        echo " Creating Nix first-boot installer"
        echo "========================================"

        mkdir -p /usr/libexec

        cat > /usr/libexec/install-nix-firstboot <<'NIXINSTALL'
        #!/usr/bin/env bash

        set -euo pipefail

        MARKER="/var/lib/nix-installed"


        # --------------------------------------------------------
        # Already installed?
        # --------------------------------------------------------

        if [[ -f "$MARKER" ]]; then
            echo "Nix is already installed."
            exit 0
        fi


        # --------------------------------------------------------
        # Wait for /nix
        # --------------------------------------------------------

        echo "Waiting for /nix mount..."

        for _ in {1..60}; do
            if mountpoint -q /nix; then
                break
            fi

            sleep 1
        done

        if ! mountpoint -q /nix; then
            echo "ERROR: /nix is not mounted."
            exit 1
        fi

        echo "/nix is mounted."


        # --------------------------------------------------------
        # Network
        # --------------------------------------------------------

        echo "Checking network..."

        for _ in {1..60}; do

            if curl \
                --silent \
                --fail \
                --max-time 5 \
                https://nixos.org/ \
                >/dev/null 2>&1; then

                break

            fi

            sleep 2

        done


        # --------------------------------------------------------
        # Install Nix
        #
        # IMPORTANT:
        #
        # --daemon = multi-user installation
        # --------------------------------------------------------

        echo "========================================"
        echo " Installing Nix"
        echo "========================================"

        if [[ ! -x /nix/var/nix/profiles/default/bin/nix ]]; then

            curl \
                --proto '=https' \
                --tlsv1.2 \
                --fail \
                --location \
                https://nixos.org/nix/install \
                | sh -s -- --daemon

        else

            echo "Nix already exists."

        fi


        # --------------------------------------------------------
        # Configure Nix
        # --------------------------------------------------------

        echo "========================================"
        echo " Configuring Nix"
        echo "========================================"

        mkdir -p /etc/nix

        cat > /etc/nix/nix.conf <<'NIXCONF'
        experimental-features = nix-command flakes
        auto-optimise-store = true
        max-jobs = auto
        NIXCONF


        # --------------------------------------------------------
        # Global shell environment
        # --------------------------------------------------------

        mkdir -p /etc/profile.d

        cat > /etc/profile.d/nix.sh <<'NIXPROFILE'
        if [ -e /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh ]; then
            . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
        fi
        NIXPROFILE

        chmod 644 /etc/profile.d/nix.sh


        # --------------------------------------------------------
        # Configure normal users
        # --------------------------------------------------------

        echo "========================================"
        echo " Configuring users"
        echo "========================================"

        while IFS=: read -r USERNAME _ UID _ _ HOME SHELL; do

            if [[ "$UID" -lt 1000 || "$UID" -ge 60000 ]]; then
                continue
            fi

            if [[ "$SHELL" == "/usr/sbin/nologin" ]]; then
                continue
            fi

            if [[ "$SHELL" == "/sbin/nologin" ]]; then
                continue
            fi

            if [[ ! -d "$HOME" ]]; then
                continue
            fi

            echo "Configuring Nix for: $USERNAME"

            mkdir -p "$HOME/.config/nix"

            cat > "$HOME/.config/nix/nix.conf" <<'USERNIX'
        experimental-features = nix-command flakes
        USERNIX

            chown \
                "$USERNAME:$(id -gn "$USERNAME")" \
                "$HOME/.config/nix"

            chown \
                "$USERNAME:$(id -gn "$USERNAME")" \
                "$HOME/.config/nix/nix.conf"

        done < /etc/passwd


        # --------------------------------------------------------
        # Reload systemd
        #
        # The Nix installer creates nix-daemon.service.
        # --------------------------------------------------------

        echo "========================================"
        echo " Reloading systemd"
        echo "========================================"

        systemctl daemon-reload


        # --------------------------------------------------------
        # Enable daemon if it exists
        # --------------------------------------------------------

        if systemctl list-unit-files \
            --no-legend \
            nix-daemon.service \
            >/dev/null 2>&1; then

            systemctl enable nix-daemon.service || true

        fi


        # --------------------------------------------------------
        # Mark installation complete
        # --------------------------------------------------------

        echo "========================================"
        echo " Nix installation completed"
        echo "========================================"

        mkdir -p /var/lib

        touch "$MARKER"

        exit 0
        NIXINSTALL

        chmod 0755 /usr/libexec/install-nix-firstboot

        echo "========================================"
        echo " Creating nix-firstboot.service"
        echo "========================================"

        cat > /etc/systemd/system/nix-firstboot.service <<'NIXFIRSTBOOT'
        [Unit]
        Description=Install Nix on first boot

        Requires=nix.mount
        After=nix.mount

        Wants=network-online.target
        After=network-online.target

        [Service]
        Type=oneshot
        ExecStart=/usr/libexec/install-nix-firstboot
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target
        NIXFIRSTBOOT

        systemctl enable nix-firstboot.service

        echo "========================================"
        echo " Nix first-boot configuration complete"
        echo "========================================"

  # 6. Custom scripts
  - type: script
    snippets:
      - "sed -i 's|SHELL=/bin/bash|SHELL=/usr/bin/fish|' /etc/default/useradd"
      - "grep -qxF '/usr/bin/fish' /etc/shells || echo '/usr/bin/fish' >> /etc/shells"
      - "echo 'Custom image build finished successfully!'"

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
