---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bootnetic
description: Custom Fedora Kinoite image for ThinkPad T460

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  # Enable COPR repositories using the supported dnf module
  - type: dnf
    repos:
      copr:
        - peterwu/iosevka
        - theblackdon/kineticwe
        - lionheartp/Hyprland
        - theblackdon/dcli-bootc
        - linuxgamerlife/lgl-dnf-helper
        - linuxgamerlife/lgl-emoji-picker

  # Custom yum repositories (Terra)
  - type: script
    snippets:
      - "curl -sL https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo -o /etc/yum.repos.d/terra.repo"

  # Install base packages
  - type: rpm-ostree
    remove:
      - firefox
      - firefox-langpacks
      - kglobalacceld
      - kdecoration
    install:
      - kineticwe
      - noctalia-git
      - qt5ct
      - qt6ct
      - nwg-look
      - adw-gtk3-theme
      - kitty
      - fish
      - lgl-emoji-picker
      - lgl-dnf-helper
      - iosevka-fonts
      - fastfetch
      - btop
      - htop
      - git
      - zoxide
      - eza
      - gwenview
      - haruna
      - zathura
      - neovim

  # 3. System-wide Flatpaks
  - type: default-flatpaks
    notify: true
    system:
      repo-url: https://dl.flathub.org/repo/flathub.flatpakrepo
      repo-name: flathub
      repo-description: Flathub
      install:
        - com.google.Chrome
        - io.github.equibop.Equibop

  # 4. Install Homebrew
  - type: brew

  # 5. Install Nix (via script module)
  - type: script
    snippets:
     - "curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install linux --init none --no-confirm"

  # 6. Custom scripts
  - type: script
    snippets:
      - "sed -i 's|SHELL=/bin/bash|SHELL=/usr/bin/fish|' /etc/default/useradd"
      - "grep -qxF '/usr/bin/fish' /etc/shells || echo '/usr/bin/fish' >> /etc/shells"
      - "echo 'Custom image build finished successfully!'"